<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFDD66;--card:#FFFDF7;--ink:#2B1A12;--mut:#7A6455;--pink:#FF6F91;--teal:#0F7B6C;--line:#2B1A1218;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#3A2418;--card:#4A3122;--ink:#FFF3DC;--mut:#D9BFA3;--line:#FFF3DC22}}
:root[data-theme="dark"]{--bg:#3A2418;--card:#4A3122;--ink:#FFF3DC;--mut:#D9BFA3;--line:#FFF3DC22}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,sans-serif;line-height:1.4}
#app{max-width:480px;margin:0 auto;padding:18px 18px 96px;min-height:100vh}
h1{font-size:46px;line-height:1;margin:.3em 0;font-weight:800;letter-spacing:-.03em}h2{font-size:30px;line-height:1.05;margin:.2em 0 .5em;font-weight:800;letter-spacing:-.02em}h3{margin:0 0 .3em;font-size:18px}
p{margin:.4em 0}.mut{color:var(--mut);font-size:14px}
.card{background:var(--card);border-radius:28px;padding:20px;margin:14px 0;box-shadow:0 6px 0 var(--line)}
.btn{font:inherit;font-weight:600;border:0;border-radius:99px;padding:14px 22px;background:var(--ink);color:var(--bg);cursor:pointer;font-size:16px;transition:transform .12s}
.btn:active{transform:scale(.96)}.btn.pink{background:var(--pink);color:#2B1A12}.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink)}.btn.sm{padding:9px 14px;font-size:14px}.btn.w{width:100%;margin-top:8px}
button:focus-visible,input:focus-visible,textarea:focus-visible,.chip:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
input,textarea,select{font:inherit;width:100%;padding:14px 16px;border-radius:18px;border:2px solid var(--line);background:var(--card);color:var(--ink);margin:6px 0}
.chip{display:inline-block;border:2px solid var(--ink);border-radius:99px;padding:9px 15px;margin:4px 4px 4px 0;cursor:pointer;font-size:15px;user-select:none}.chip.on{background:var(--ink);color:var(--bg)}
.av{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:24px;color:#2B1A12;flex:none;background-size:cover}
.row{display:flex;gap:14px;align-items:center}.sp{justify-content:space-between}
.tag{display:inline-block;background:var(--bg);color:var(--ink);border-radius:99px;padding:3px 10px;font-size:12px;margin:2px 3px 2px 0}
.why{list-style:none;padding:0;margin:10px 0}.why li{padding:7px 0;border-top:1px dashed var(--line)}

nav button{flex:1;max-width:96px;background:none;border:0;color:var(--bg);font:inherit;font-size:12px;padding:6px 0;opacity:.6;cursor:pointer}nav button.on{opacity:1;font-weight:800}nav b{display:block;font-size:20px;font-weight:400}
.bar{height:12px;border-radius:9px;background:var(--pink);margin:4px 0}.stat{font-size:44px;font-weight:800;line-height:1}

.modal{position:fixed;inset:0;background:var(--pink);z-index:9;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:30px;color:#2B1A12}
.pop{animation:pop .6s cubic-bezier(.2,1.6,.4,1)}@keyframes pop{from{transform:scale(.3) rotate(-8deg);opacity:0}}
.cup{font-size:96px;animation:steam 2.4s ease-in-out infinite}@keyframes steam{50%{transform:translateY(-8px)}}
.ticket{background:#2B1A12;color:#FFDD66;border-radius:30px;padding:26px;text-align:center;border:3px dashed #FFDD66;outline:10px solid #2B1A12}
.ticket h2{color:#FFF3DC;font-size:34px}
.prog{height:8px;background:var(--line);border-radius:9px;margin:14px 0}.prog i{display:block;height:100%;background:var(--ink);border-radius:9px;transition:width .3s}
.sim{font-size:11px;background:var(--pink);color:#2B1A12;border-radius:99px;padding:2px 8px;font-weight:600}
.sw{touch-action:pan-y;cursor:grab;user-select:none}.stamp{position:absolute;top:18px;font-weight:800;font-size:24px;border:4px solid;border-radius:14px;padding:2px 10px;opacity:0;transform:rotate(-12deg);pointer-events:none}.stamp.y{left:16px;color:#0F7B6C}.stamp.l{right:16px;color:#C2410C;transform:rotate(12deg)}

</style></head><body><div id="app"></div>
<script>
const DAYS=['Mon','Tue','Wed','Thu','Fri'],DN={Mon:'Monday',Tue:'Tuesday',Wed:'Wednesday',Thu:'Thursday',Fri:'Friday'};
const PARTS=[['☀️','Morning','8–10 AM'],['☕','Late morning','10 AM–12 PM'],['🥪','Lunch','12–2 PM'],['🌇','Afternoon','3–5 PM'],['🍻','Evening','6–8 PM']];
const GOALS={job:'Find a job',ind:'Meet people in my industry',found:'Meet founders',inv:'Meet investors',collab:'Find collaborators',learn:'Learn about Israeli tech',help:'Help other people',friends:'Make friends in the professional community',moved:'I just moved here',other:'Other'};
const CITY={J:'Jerusalem',T:'Tel Aviv',M:"Modi'in",B:'Beit Shemesh'};
const HOOD={J:['Baka','German Colony','Rehavia','Talpiot'],T:['Florentin','Rothschild','Neve Tzedek'],M:['Buchman','Center'],B:['Ramat Beit Shemesh','Center']};
const CAFE={J:['Café Kadosh, Rehavia','Mona Coffee, Downtown','Kafe Rimon, Baka'],T:['Café Xoho, Florentin','Cafe Landwer, Rothschild'],M:['Aroma, Modi\'in Mall'],B:['Café Neeman, Center']};
const RAW=`Maya Ben-David|Growth Lead|Wixly (SaaS)|J|us saas mkt|ind,learn,collab|Wed3 Thu1 Fri1|she's building growth at a SaaS startup and sells to the US
Daniel Katz|Recruiter|TalentBridge|J|hire olim|job,help|Wed3 Mon2 Thu4|he places marketers and partnership folks at Israeli tech companies
Noa Shapira|Partnerships Manager|Cloudlane|J|us saas|ind,friends|Wed3 Thu1 Tue2|she runs US channel partnerships from Jerusalem
Avi Levy|Founder|Kettle.ai|J|found us|collab,inv|Fri1 Wed3 Thu1|he's a founder expanding into America and needs a go-to-market brain
Rachel Green|Platform Lead|Mount Scopus Ventures|J|vc olim us|found,help|Thu1 Wed3|she connects portfolio startups with talent from abroad
Yossi Amar|Backend Engineer|Payable|J|dev fintech|friends,learn|Mon4 Tue4 Wed3|he's an engineer who wants to understand how marketing sees his product
Tamar Peretz|Product Manager|Honeycomb IL|J|prod saas|ind,collab|Thu4 Fri1 Wed3|she's a PM who could use a sharp voice on positioning
Ben Cohen|Operator (ex-NYC)|AdRoll IL|J|us adtech olim|moved,friends|Wed3 Thu1 Mon2|he made Aliyah from New York and works in adtech
Shira Mizrahi|Community Manager|Hebrew U Startups|J|mkt found|help,ind|Tue1 Wed3|she knows every founder on campus and loves making intros
Eli Stern|Investor|Zion Angels|J|vc found|found,help|Fri1 Thu1|he backs early-stage founders and wants to hear how US buyers think
Lior Ashkenazi|Growth Marketer|Monday-ish|T|saas mkt us|ind,collab|Wed3 Thu4|she's an Israeli growth marketer who lived in Chicago
Yael Dahan|VP Marketing|Fintechly|T|fintech mkt|ind,friends|Thu4 Wed3|she leads a marketing team and hires senior operators
Omer Golan|Founder|Stackwise|T|found dev|collab,inv|Wed3 Fri1|he's building a dev tool and needs early marketing help
Dana Rosen|Talent Partner|Aleph Capital|T|hire vc|found,job|Tue2 Wed3|she recruits for a whole VC portfolio
Guy Tal|Partnerships Lead|Pixelate|T|adtech saas us|ind,learn|Wed3 Mon4|he does partnerships between Israeli adtech and US agencies
Nir Barak|Sales Ops|Gong-like Co|T|saas us olim|moved,friends|Thu1 Wed3|he moved from Boston and knows the Tel Aviv scene
Hila Avraham|Product Designer|Figmaish|T|prod|friends,collab|Fri1 Wed3|she's a designer who wants better stories from marketers
Tomer Nissim|Angel Investor|Independent|T|vc found|found,help|Thu1 Fri1|he invests in marketing-led startups
Roni Weiss|Content Lead|Cyberly|T|mkt saas|ind,collab|Wed3 Tue1|she writes for security buyers and loves a good brand nerd
Amit Hadad|CTO|Routely|T|dev found|collab,learn|Wed3 Thu4|he's a technical founder who has never hired a marketer
Sarah Klein|Marketing Manager|Modi'in Labs|M|us mkt olim|moved,ind|Wed3 Thu1 Tue2|she made Aliyah two years ago and moved from marketing in the US
Idan Shalom|Full-stack Dev|Payweave|M|dev fintech|friends,collab|Mon4 Wed3|he commutes to Tel Aviv and wants local friends
Michal Levi|HR Business Partner|Nexa|M|hire|help,job|Thu1 Wed3|she knows who's hiring across Israeli tech
Ariel Fried|Founder|Sproutly|M|found us olim|collab,found|Fri1 Wed3|he sold to US customers before moving here
Keren Mor|Product Marketing|Cloudlane|M|mkt saas|ind,learn|Wed3 Tue1|she does PMM at a fast-growing SaaS
Josh Adler|Account Executive|Riskify-ish|B|us olim saas|moved,friends|Wed3 Thu4|he moved from Teaneck and sells to American customers
Chana Bloom|Operations Lead|Hatch|B|olim found|help,moved|Wed3 Fri1|she's an operator who made Aliyah from Toronto
Moshe Regev|Angel Investor|Independent|B|vc found|found,inv|Thu1 Wed3|he backs Olim founders
Talia Ohana|Data Analyst|Bankly|B|fintech dev|learn,friends|Tue1 Wed3|she wants to talk analytics and Amazon ads
Uri Segal|Recruiter|Remote IL|B|hire olim|job,help|Wed3 Mon2|he hires remote marketers for Israeli teams`;
const DEMO=RAW.split('\n').map((r,i)=>{const[n,role,co,c,t,g,s,hook]=r.split('|');return{id:i,name:n,role,co,c,tags:t.split(' '),goals:g.split(','),slots:s.split(' ').map(x=>({d:x.slice(0,3),p:+x[3]})),hook,hood:HOOD[c][i%HOOD[c].length]}});
const RUN={J:{J:1,M:28,B:30,T:58},T:{T:1,J:58,M:22,B:55},M:{M:1,J:28,T:22,B:32},B:{B:1,J:30,T:55,M:32}};
const h=s=>[...s].reduce((a,c)=>a*31+c.charCodeAt(0)>>>0,7);
const COLS=['#FF6F91','#8ED1A8','#FFB562','#9CC9F5','#C9A7F0'];
const S={v:'landing',step:0,me:{name:'Ethan',photo:'',city:'J',hood:'Baka',role:'Media Manager',co:'Mars United Commerce',ind:'Marketing',goals:['job','ind','moved'],talk:'Amazon advertising and how US brands actually buy media',interesting:'Worked in advertising for 10 years. Just made Aliyah.',parts:[2,3],radius:10,tags:['us','olim','mkt']},demo:true,likes:{},passed:{},coffees:[],invites:0,known:new Set(),li:0,ref:'',pick:null,slot:null,sel:null,tab:'feed'};
function dist(u){return +(RUN[S.me.city][u.c]+(u.c===S.me.city?(h(u.name)%50)/10:(h(u.name)%40)/10)).toFixed(1)}
function overlap(u){const o=[];u.slots.forEach(s=>{if(S.me.parts.includes(s.p))o.push(s)});return o}
function score(u){const g=u.goals.filter(x=>S.me.goals.includes(x)).length,t=u.tags.filter(x=>S.me.tags.includes(x)).length;const comp=u.tags.some(x=>['hire','vc','found','saas'].includes(x))&&!S.me.tags.includes('found')?2:0;return g*2+t*1.5+comp+overlap(u).length*1.5-dist(u)/12}
function reasons(u){const r=[`📍 ${dist(u)} km apart · ${u.hood}, ${CITY[u.c]}`];const sh=u.tags.filter(x=>S.me.tags.includes(x));if(sh.includes('us'))r.push('🇺🇸🇮🇱 Both know the US + Israeli markets');if(sh.includes('olim'))r.push('🛬 You both landed in Israeli tech recently');r.push(`📈 You're in ${S.me.ind.toLowerCase()||'your field'}; ${u.hook}`);const g=u.goals.find(x=>S.me.goals.includes(x));if(g)r.push(`🎯 You're both here to: ${GOALS[g].toLowerCase()}`);const o=overlap(u)[0];if(o)r.push(`☕ You both have ${DN[o.d]} ${PARTS[o.p][1].toLowerCase()} free`);return r.slice(0,5)}
function topic(u){const t=u.tags;return t.includes('olim')&&S.me.tags.includes('olim')?'Breaking into Israeli tech':t.includes('us')?'What Israeli companies get wrong about US buyers':t.includes('vc')?'How investors judge marketing-led startups':t.includes('hire')?'Getting hired in Israeli tech without a network':'What you\'re both building right now'}
function starters(u){const t=u.tags,a=[];if(t.includes('us')&&S.me.tags.includes('us'))a.push(['You both work with US customers.','What\'s something Israeli companies misunderstand about selling in America?']);if(t.includes('olim')&&S.me.tags.includes('olim'))a.push(['You both recently joined the local tech ecosystem.','What surprised you most about the Israeli tech scene?']);a.push(['Career overlap.',`What's the most useful thing you learned working as a ${u.role.toLowerCase()}?`]);a.push(['Something human.','What\'s your go-to order, and who introduced you to it?']);a.push(['Unusually excited.','What are you working on that you\'re unusually excited about?']);return a.slice(0,3)}
function av(u,sz){const c=COLS[h(u.name)%5],ini=u.name.split(' ').map(x=>x[0]).join('').slice(0,2);const st=u.photo?`background-image:url(${u.photo})`:`background:${c}`;return `<div class="av" style="${st};${sz?`width:${sz}px;height:${sz}px`:''}">${u.photo?'':ini}</div>`}
function feed(){const lim=S.invites>=3?99:S.me.radius;return DEMO.filter(u=>!S.passed[u.id]&&!S.known.has(u.name)&&dist(u)<=lim).sort((a,b)=>score(b)-score(a))}
function go(v){S.v=v;if(['feed','coffees','net','around','admin'].includes(v))S.tab=v;render();scrollTo(0,0)}
const BASE=/^https?:/.test(location.origin)&&!/claude/.test(location.hostname)?location.origin+location.pathname:'https://claude.ai/artifact/CpfgHRR3jfpBRFsCHbFhAX';
const REF=()=>BASE+'?ref='+(M.code||h(M.name).toString(36).slice(0,5));
const $=s=>document.getElementById(s);
function nav(){return `<nav>${[['feed','☕','Discover'],['coffees','🎟️','Coffees'],['net','🌱','IRL'],['around','📍','Around'],['profile','🙂','Me']].map(([k,i,l])=>`<button class="${S.tab===k?'on':''}" onclick="go('${k}')"><b>${i}</b>${l}</button>`).join('')}</nav>`}
function foot(){return `<footer class="mut">Built for people who think networking should feel less like networking.<br><a href="#" onclick="go('admin');return false" style="color:inherit">Community mode</a></footer>`}
function landing(){return `<div style="padding-top:20px"><div class="cup">☕</div><p class="mut"><b>Yalla Kafe ☕</b> · ${S.ref?'a friend invited you':'yalla, coffee?'}</p><h1>Meet people outside your network.</h1><p style="font-size:19px">A smarter way to find interesting people nearby — based on what you do, what you're interested in, and why you might actually want to meet.</p><p class="mut" style="font-style:italic">You probably know enough people. You just don't know the right ones yet.</p><button class="btn w" onclick="startReal()">Find My People →</button><button class="btn w" style="background:#0A66C2;color:#fff" onclick="go('li')">in&nbsp; Continue with LinkedIn</button><button class="btn ghost w" onclick="startDemo()">I'm just curious</button><p class="mut" style="margin-top:18px">🧪 Private beta · Jerusalem first</p><p class="mut">☕ Built for people who'd rather have one good coffee than 100 LinkedIn connections.</p></div>${foot()}`}
const M=S.me;
function onb(){const st=S.step,pct=(st+1)/7*100;let b='';
if(st==0)b=`<h2>First things first — who are you?</h2><input placeholder="Name" value="${M.name}" oninput="M.name=this.value"><input type="email" placeholder="Email (we'll tell you when you have a match)" value="${M.email||''}" oninput="M.email=this.value" autocomplete="email"><input type="file" accept="image/*" onchange="pic(this)"><p class="mut">Photo is optional. Faces help coffee happen.</p><select onchange="M.city=this.value">${Object.entries(CITY).map(([k,v])=>`<option value="${k}" ${M.city==k?'selected':''}>${v}</option>`).join('')}</select><input placeholder="Neighborhood (optional)" value="${M.hood}" oninput="M.hood=this.value"><p class="mut">🔒 Only your neighborhood and rough distance are ever shown. Never your address.</p>`;
if(st==1)b=`<h2>What do you do?</h2><input placeholder="Role" value="${M.role}" oninput="M.role=this.value"><input placeholder="Company" value="${M.co}" oninput="M.co=this.value"><input placeholder="Industry" value="${M.ind}" oninput="M.ind=this.value">`;
if(st==2)b=`<h2>What brings you here?</h2><p class="mut">Pick as many as you like.</p>${Object.entries(GOALS).map(([k,v])=>`<span tabindex=0 class="chip ${M.goals.includes(k)?'on':''}" onclick="tg(M.goals,'${k}')">${v}</span>`).join('')}`;
if(st==3)b=`<h2>What can you talk about for hours?</h2><textarea rows=4 oninput="M.talk=this.value">${M.talk}</textarea>`;
if(st==4)b=`<h2>What makes you interesting to someone else?</h2><textarea rows=4 oninput="M.interesting=this.value">${M.interesting}</textarea><p class="mut">“Know way too much about Amazon advertising.” · “Can explain VC without using the word synergy.” · “Just made Aliyah.”</p>`;
if(st==5)b=`<h2>When are you generally free for coffee?</h2>${PARTS.map((p,i)=>`<span tabindex=0 class="chip ${M.parts.includes(i)?'on':''}" onclick="tg(M.parts,${i})">${p[0]} ${p[1]}</span>`).join('')}<p class="mut">🔒 Others only see this after you both say yes.</p>`;
if(st==6)b=`<h2>One last thing…</h2><p>How far will you travel for a great conversation?</p>${[1,3,5,10,99].map(k=>`<span tabindex=0 class="chip ${M.radius==k?'on':''}" onclick="M.radius=${k};render()">${k==99?'Worth the trip':k+' km'}</span>`).join('')}<label class="mut" style="display:block;margin-top:14px"><input type="checkbox" ${M.consent?'checked':''} onchange="M.consent=this.checked"> I agree to the <a href="privacy.html" target="_blank">privacy policy</a> and to be emailed about the beta.</label>${S.err?`<p style="color:#C2410C"><b>${S.err}</b></p>`:''}`;
return `<div class="prog"><i style="width:${pct}%"></i></div>${b}<div class="row" style="margin-top:20px">${st?`<button class="btn ghost" onclick="S.step--;render()">Back</button>`:''}<button class="btn pink" style="flex:1" onclick="${st==6?"joinBeta()":'S.step++;render()'}">${st==6?'Join the beta ☕':'Next'}</button></div>`}
function tg(a,k){const i=a.indexOf(k);i<0?a.push(k):a.splice(i,1);render()}
function pic(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{M.photo=r.result};r.readAsDataURL(f)}
function cardH(u){return `<div class="stamp y">COFFEE ☕</div><div class="stamp l">LATER 👋</div><div class="row">${av(u,72)}<div><h3 style="margin:0">${u.name}</h3><div>${u.role}, ${u.co}</div><div class="mut">📍 ${dist(u)} km · ${u.hood}</div></div></div><p style="margin-top:12px"><b>Why you two?</b></p><ul class="why">${reasons(u).slice(0,4).map(x=>`<li>${x}</li>`).join('')}</ul><div class="talk">You should talk about: “${topic(u)}”</div><div class="mut" style="text-align:center">Tap for the full profile</div>`}
function feedV(){const l=feed(),nearby=DEMO.filter(u=>dist(u)<=M.radius).length,u=l[0],n=l[1];return `<h2>Your next coffee is probably ${u?dist(u):'2.3'} km away.</h2>${S.li?`<p class="mut">🔗 LinkedIn connected · ${S.li} connections read on your device · ${S.known.size} people you already know are hidden</p>`:''}<p class="mut">${S.demo?'<span class="sim">Simulated demo</span> · ':''}${l.length} people you don't know yet. Swipe right for coffee, left for later.</p>${u?`<div style="position:relative;margin-top:14px">${n?`<div class="card" style="position:absolute;inset:0;transform:scale(.95) translateY(14px);opacity:.7;margin:0"></div>`:''}<div id="top" class="card sw" style="margin:0;position:relative">${cardH(u)}</div></div><div class="row" style="justify-content:center;gap:22px;margin:22px 0"><button class="btn ghost" aria-label="Not for me" onclick="fling('n')">🚫</button><button class="btn ghost" aria-label="Maybe later" onclick="fling('l')">👋</button><button class="btn pink" style="font-size:22px;padding:16px 26px" aria-label="I'd grab coffee" onclick="fling('y')">☕</button></div>`:`<div class="card">You've seen everyone nearby. Invite a few people and the map gets bigger.</div>`}${crit(nearby)}`}
function act(k){const l=feed();if(!l[0])return;const id=l[0].id;if(k=='y')yes(id);else{S.passed[id]=1;render()}}
function fling(k){const el=$('top');if(!el)return act(k);const x=k=='y'?700:-700;el.style.transition='transform .3s,opacity .3s';el.style.transform=k=='n'?'translateY(500px) rotate(10deg)':`translateX(${x}px) rotate(${x/25}deg)`;el.style.opacity=0;setTimeout(()=>act(k),260)}
function initSwipe(){const el=$('top');if(!el)return;let x0,y0,dx=0,dy=0,d=false;const sy=el.querySelector('.stamp.y'),sl=el.querySelector('.stamp.l');
el.onpointerdown=e=>{x0=e.clientX;y0=e.clientY;d=true;dx=dy=0;el.setPointerCapture(e.pointerId);el.style.transition='none'};
el.onpointermove=e=>{if(!d)return;dx=e.clientX-x0;dy=e.clientY-y0;el.style.transform=`translate(${dx}px,${dy*.3}px) rotate(${dx/18}deg)`;sy.style.opacity=Math.max(0,dx/100);sl.style.opacity=Math.max(0,-dx/100)};
el.onpointerup=()=>{if(!d)return;d=false;if(Math.abs(dx)>100)return fling(dx>0?'y':'l');if(Math.abs(dx)<6&&Math.abs(dy)<6){S.pick=feed()[0].id;return go('prof')}el.style.transition='transform .25s';el.style.transform='';sy.style.opacity=sl.style.opacity=0};
el.onpointercancel=()=>{d=false;el.style.transform=''}}
function crit(n){const j=S.invites;return `<div class="card" style="background:var(--ink);color:var(--bg)"><h3>We're building your neighborhood.</h3><p>Only ${n+7} people are on Yalla Kafe near ${CITY[M.city]} right now.</p><div class="grid" style="color:var(--ink)"><div><div class="stat">${n}</div>nearby</div><div><div class="stat">${Math.min(8,feed().length)}</div>potential matches</div></div><p>3 new people joined this week.</p>${j>=3?'<p><b>Unlocked: the whole country is now in your feed. 🎉</b></p>':`<button class="btn pink w" onclick="go('ref')">Invite 3 interesting people (${j}/3)</button><p class="mut" style="color:var(--mut)">Invite 3 and we'll unlock wider discovery.</p>`}</div>`}
function yes(id){S.pick=id;const u=DEMO[id];S.likes[id]=1;if(h(u.name)%3!==0||id==0){S.v='match';render()}else{alert(u.name.split(' ')[0]+' hasn\'t seen you yet. We\'ll tell you if it\'s mutual.');S.passed[id]=1;render()}}
function matchV(){const u=DEMO[S.pick];return `<div class="modal"><div class="cup pop">☕</div><h1 class="pop" style="font-size:40px">IT'S A COFFEE MATCH ☕️</h1><p style="font-size:18px">You both thought the other person seemed interesting.</p><div class="row" style="margin:14px 0">${av(M,72)}<b style="font-size:28px">×</b>${av(u,72)}</div><button class="btn w" onclick="S.slot=null;go('sched')">Pick a time →</button></div>`}
function schedV(){const u=DEMO[S.pick],o=overlap(u).length?overlap(u):u.slots;const cf=CAFE[u.c==M.city?M.city:u.c],cafe=cf[h(u.name)%cf.length];return `<h2>Now let's make it real.</h2><div class="card"><p><b>You and ${u.name.split(' ')[0]} both have time:</b></p>${o.map((s,i)=>`<span tabindex=0 class="chip ${S.slot===i?'on':''}" onclick="S.slot=${i};render()">${DN[s.d]}<br>${PARTS[s.p][2]}</span>`).join('')}</div>${S.slot!=null?`<div class="card"><p>How about here?</p><h3>☕ ${cafe}</h3><p class="mut">${(dist(u)*.55+.6).toFixed(1)} km from you · ${(dist(u)*.45+.5).toFixed(1)} km from ${u.name.split(' ')[0]}</p><button class="btn pink w" onclick="book('${cafe.replace(/'/g,"\\'")}',${S.slot})">Confirm coffee</button></div>`:''}`}
function book(cafe,i){const u=DEMO[S.pick],o=overlap(u).length?overlap(u):u.slots,s=o[i];S.coffees.push({id:S.pick,cafe,day:DN[s.d],time:PARTS[s.p][2].split('–')[0].replace(' AM','').replace(' PM','')+(s.p<3?' AM':' PM'),n:S.coffees.length+7});go('booked')}
function bookedV(){const c=S.coffees[S.coffees.length-1],u=DEMO[c.id],f=u.name.split(' ')[0];const inv=`${f} thought you might get along with ${M.name}. You're both working in Israeli tech and have overlapping experience. Want to grab coffee? ${REF()}`;return `<div class="cup" style="text-align:center">☕</div><h2 style="text-align:center">Coffee booked. Go meet someone interesting.</h2><p class="mut" style="text-align:center">${c.day} · ${c.cafe}</p><h3>Three things to bring up</h3>${starters(u).map(x=>`<div class="card" style="margin:8px 0"><div class="mut">${x[0]}</div><b>“${x[1]}”</b></div>`).join('')}<div class="ticket" style="margin:26px 4px"><div>☕ COFFEE #${String(c.n).padStart(2,'0')}</div><h2>${M.name.split(' ')[0]} × ${f}</h2><div>${CITY[u.c]}</div><p style="color:#FFF3DC">“${M.tags.includes('us')&&u.tags.includes('us')?'US marketing × Israeli tech':topic(u)}”</p><div>${c.day} · ${c.time}</div><p style="font-size:13px;margin-top:16px;color:#FFF3DC">Want to meet someone interesting too?<br><b style="color:#FFDD66">Join Yalla Kafe</b></p></div><button class="btn w" onclick="navigator.share?navigator.share({text:'Coffee #${c.n} ☕ Yalla Kafe · ${REF()}'}).catch(()=>{}):alert('Screenshot the card and share it!')">Share my coffee card</button><div class="card"><h3>Know someone else ${f} should meet?</h3><div class="mut">Send this invite:</div><p>“${inv}”</p><button class="btn ghost sm" onclick="navigator.clipboard&&navigator.clipboard.writeText(\`${inv.replace(/`/g,'')}\`);S.invites++;this.textContent='Copied ✓'">Copy invite</button></div><button class="btn ghost w" onclick="go('feed')">Back to discovering</button>`}
function profV(){const u=DEMO[S.pick],o=overlap(u);return `<button class="btn ghost sm" onclick="go('feed')">← Back</button><div class="card"><div class="row">${av(u,80)}<div><h2 style="margin:0">${u.name}</h2><div>${u.role}, ${u.co}</div><div class="mut">${u.hood}, ${CITY[u.c]} · <span class="sim">Simulated profile</span></div></div></div><h3 style="margin-top:16px">We suggested ${u.name.split(' ')[0]} because…</h3><ul class="why">${reasons(u).map(x=>`<li>${x}</li>`).join('')}</ul><p><b>I'm here because…</b> ${u.goals.map(g=>GOALS[g].toLowerCase()).join(', ')}.</p><p><b>I can help with…</b> ${u.hook.replace(/^(she|he)'s /,'')}</p><p><b>I'd love to meet…</b> ${u.tags.includes('found')?'interesting people':'someone outside my usual circle'}.</p><p><b>Interests:</b> ${u.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</p><p><b>Languages:</b> Hebrew, English</p><p class="mut">🔒 Availability stays hidden until you both say yes (${o.length} overlap${o.length==1?'':'s'} with yours).</p><button class="btn pink w" onclick="yes(${u.id})">☕ I'd grab coffee</button></div>`}
function myProf(){return `<h2>You</h2><div class="card"><div class="row">${av(M,80)}<div><h3 style="margin:0">${M.name}</h3><div>${M.role}, ${M.co}</div><div class="mut">${M.hood}, ${CITY[M.city]}</div></div></div><p><b>I'm here because…</b> ${M.goals.map(g=>GOALS[g].toLowerCase()).join(', ')}</p><p><b>I can talk for hours about…</b> ${M.talk}</p><p><b>Random fact…</b> ${M.interesting}</p><p><b>Coffee availability:</b> ${M.parts.map(p=>PARTS[p][0]+' '+PARTS[p][1]).join(', ')}</p></div><div class="card"><h3>Who sees what</h3><p>🌍 <b>Public:</b> name, photo, role, company, interests</p><p>📍 <b>Approximate:</b> neighborhood + distance in km</p><p>🔒 <b>Private:</b> availability (revealed after a mutual match), exact location (never stored or shown)</p></div><button class="btn ghost w" onclick="S.step=0;go('onb')">Edit profile</button>`}
function coffV(){return `<h2>Your coffees</h2>${S.coffees.length?S.coffees.map(c=>`<div class="card"><b>☕ #${String(c.n).padStart(2,'0')} · ${DEMO[c.id].name}</b><div class="mut">${c.day} · ${c.time} · ${c.cafe}</div><button class="btn sm ghost" onclick="S.coffees.done=(S.coffees.done||0)+1;this.textContent='Marked done ✓'">We met!</button></div>`).join(''):'<div class="card">No coffees yet. That\'s the whole game. Find someone in Discover and say yes.</div>'}`}
function netV(){const c=S.coffees.length;return `<h2>Your Network, IRL.</h2><p class="mut">Real people, real tables. No follower counts.</p><div class="grid"><div><div class="stat">${12+Object.keys(S.likes).length}</div>people discovered</div><div><div class="stat">${5+c}</div>coffee matches</div><div><div class="stat">${3+(S.coffees.done||0)}</div>coffees completed</div><div><div class="stat">${7+S.invites}</div>introductions created</div></div><div class="card"><div class="stat">${2+S.invites}</div>people you introduced to someone else</div>`}
function aroundV(){const d=[['Marketing',31],['Tech',28],['Founders',19],['Engineering',24],['Product',17],['VC / Investing',11],['Other',13]];return `<h2>Who's around?</h2><div class="card"><h3>Jerusalem · 143 members</h3><p class="mut">🎉 23 people joined this week.</p>${d.map(([k,v])=>`<div class="row sp"><span>${k}</span><b>${v}</b></div><div class="bar" style="width:${v/31*100}%"></div>`).join('')}</div><p class="mut"><span class="sim">Simulated</span> numbers for the demo.</p>`}
function adminV(){const k=[['Total users',143],['Active users',88],['Matches',412],['Mutual matches',131],['Coffee bookings',64],['Completed coffees',47],['Invites sent',96],['Referral rate','31%'],['Match rate','38%'],['Mutual match rate','32%'],['Booking rate','49%'],['Coffee completion','73%'],['7-day retention','54%'],['30-day retention','36%']];return `<h2>Community mode</h2><div class="card" style="background:var(--ink);color:var(--bg)"><div class="mut">North star</div><div class="stat" style="color:var(--pink)">47</div><b>Real coffees created.</b><p>0.53 coffees per active user. Not signups, not swipes, not messages.</p></div><div class="grid">${k.map(([a,b])=>`<div><div class="stat" style="font-size:28px">${b}</div><span class="mut">${a}</span></div>`).join('')}</div><div class="card"><p><b>Users by city:</b> Jerusalem 143 · Tel Aviv 96 · Modi'in 22 · Beit Shemesh 14</p><p><b>By industry:</b> Marketing 31 · Tech 28 · Engineering 24 · Founders 19</p><p><b>Most connected community:</b> Marketing × SaaS</p><p><b>Most underserved:</b> Beit Shemesh, Modi'in</p><p><b>Top reasons to join:</b> Meet people in my industry · I just moved here · Find a job</p></div><p class="mut">Demo data. Simulated.</p>`}
function liV(){return `<h2>Bring who you know. We'll show you who you don't.</h2><p>Yalla Kafe uses your LinkedIn connections for one thing: hiding the people you already know, so every card is someone new.</p><div class="card"><h3>Option 1 · Sign in (demo)</h3><p class="mut">Simulates LinkedIn sign-in: fills your name, role and company, and hides a few people you'd already know.</p><button class="btn w" style="background:#0A66C2;color:#fff" onclick="liSim()">Continue with LinkedIn (demo)</button></div><div class="card"><h3>Option 2 · Upload your connections</h3><p class="mut">On LinkedIn: Settings → Data privacy → Get a copy of your data → Connections. Upload Connections.csv here. It's read in your browser and never uploaded.</p><input type="file" accept=".csv" onchange="liCsv(this)"></div><p class="mut">🔒 We never scrape LinkedIn or show your connections to anyone. Real one-tap LinkedIn sign-in needs a small backend to complete the OAuth handshake, so this page can't do it alone yet.</p>`}
function liSim(){S.li=847;[2,7,13,20].forEach(i=>S.known.add(DEMO[i].name));S.demo=false;go('feed')}
function liCsv(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const L=r.result.split(/\r?\n/),i=L.findIndex(x=>x.startsWith('First Name')),rows=L.slice(i+1).filter(Boolean);rows.forEach(x=>{const c=x.split(','),n=(c[0]+' '+c[1]).trim();if(n)S.known.add(n)});S.li=rows.length;go('feed')};r.readAsText(f)}
function refV(){const j=S.invites;return `<h2>Bring 3 interesting people.</h2><p>Every friend who joins unlocks wider discovery for you.</p><div class="prog"><i style="width:${Math.min(3,j)/3*100}%"></i></div><p class="mut">${j}/3 joined through your link</p><div class="card"><div class="mut">Your personal link</div><p style="word-break:break-all"><b>${REF()}</b></p><button class="btn pink w" onclick="navigator.clipboard&&navigator.clipboard.writeText(REF());this.textContent='Copied ✓'">Copy link</button><button class="btn w" onclick="navigator.share?navigator.share({title:'Yalla Kafe',text:'Yalla, coffee? Meet interesting people in Israeli tech:',url:REF()}).catch(()=>{}):alert(REF())">Share…</button></div><button class="btn ghost w" onclick="S.invites++;render()">Demo: a friend just joined</button><button class="btn ghost w" onclick="go('feed')">Back to Discover</button>`}
const ETHAN=JSON.parse(JSON.stringify(S.me));
function startReal(){S.demo=false;Object.assign(M,{name:'',photo:'',hood:'',role:'',co:'',ind:'',goals:[],talk:'',interesting:'',parts:[],radius:5,tags:[],email:'',consent:false});S.step=0;S.err='';go('onb')}
function startDemo(){S.demo=true;Object.assign(M,JSON.parse(JSON.stringify(ETHAN)));go('feed')}
function err(m){S.err=m;render()}
async function joinBeta(){const C=window.CFG||{};
if(!M.name)return err('Add your name on the first screen.');
if(!/^\S+@\S+\.\S+$/.test(M.email||''))return err('Add a valid email on the first screen.');
if(!M.consent)return err('Tick the box so we can email you about the beta.');
S.err='';M.code=h(M.email.toLowerCase()).toString(36).slice(0,5);
if(!C.SUPABASE_URL){S.joined='local';return go('welcome')}
try{const r=await fetch(C.SUPABASE_URL+'/rest/v1/beta_signups',{method:'POST',headers:{apikey:C.SUPABASE_ANON_KEY,Authorization:'Bearer '+C.SUPABASE_ANON_KEY,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({email:M.email.trim().toLowerCase(),name:M.name,city:CITY[M.city],neighborhood:M.hood,role:M.role,company:M.co,industry:M.ind,goals:M.goals,talk:M.talk,interesting:M.interesting,free_parts:M.parts,radius_km:M.radius,referred_by:S.ref||null,ref_code:M.code,consent:true,source:document.referrer||'direct'})});
if(r.ok||r.status==409){S.joined='ok';go('welcome')}else err('Something went wrong ('+r.status+'). Try again?')}catch(e){err('Network hiccup. Try again?')}}
function welcomeV(){return `<div class="cup" style="text-align:center">☕</div><h2 style="text-align:center">You're in, ${M.name.split(' ')[0]}.</h2><p style="text-align:center">${S.joined=='ok'?"We're opening Jerusalem first. We'll email you when your first matches are ready.":"Preview mode: nothing was saved because this copy isn't connected to a database yet."}</p><div class="card"><h3>Move up the line</h3><p class="mut">Founding members get first matches. Invite 3 interesting people to jump the queue.</p><p style="word-break:break-all"><b>${REF()}</b></p><button class="btn pink w" onclick="navigator.clipboard&&navigator.clipboard.writeText(REF());this.textContent='Copied ✓'">Copy my link</button><button class="btn w" onclick="navigator.share?navigator.share({title:'Yalla Kafe',text:'Yalla, coffee? Meet interesting people in Israeli tech:',url:REF()}).catch(()=>{}):alert(REF())">Share…</button></div><button class="btn ghost w" onclick="startDemo()">Try the demo while you wait</button>`}
function render(){const v=S.v;let x='';if(v=='landing')x=landing();else if(v=='onb')x=onb();else if(v=='match')x=matchV();else{x={feed:feedV,prof:profV,sched:schedV,booked:bookedV,coffees:coffV,net:netV,around:aroundV,admin:adminV,profile:myProf,li:liV,ref:refV,welcome:welcomeV}[v]();if(v=='profile')S.tab='profile';x+=foot()+nav()}$('app').innerHTML=x;if(S.v=='feed')initSwipe()}
try{S.ref=new URLSearchParams(location.search).get('ref')||''}catch(e){}
render();
</script></body></html>
